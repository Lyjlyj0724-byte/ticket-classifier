name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 编译检查在前：最便宜的静态错误先 fail fast
      - name: Syntax check
        run: python -m compileall -q src tests

      # 冒烟在后：100 条小样本跑通训练链路；全量训练是重任务，不进 CI
      - name: Smoke test
        run: pytest tests/ -q
